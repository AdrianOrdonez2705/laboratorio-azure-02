[project]
name = "tsi-azure-container-lab"
version = "1.0.0"
description = "Laboratorio TSI: API inteligente contenerizada y desplegada en Azure Container Apps"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "scikit-learn>=1.5,<2.0",
  "joblib>=1.4,<2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<10.0",
  "httpx>=0.27,<1.0",
  "ruff>=0.8,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
